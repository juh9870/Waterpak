#Server-authoritative hard limits applied during reload, command execution, and scheduling.
[safety]
	# Default: 256
	# Range: 1 ~ 4096
	maxEntitiesPerEncounter = 256
	# Default: 512
	# Range: 1 ~ 16384
	maxProjectilesPerEncounter = 512
	# Default: 512
	# Range: 1 ~ 16384
	maxScheduledActionsPerEncounter = 512
	# Default: 4
	# Range: 0 ~ 8
	maxNestedFleetDepth = 4
	# Default: 24
	# Range: 1 ~ 128
	maxPlacementAttemptsPerEntity = 24
